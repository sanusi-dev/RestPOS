{% extends "web/base.html" %}
{% block page_title %}RestPOS{% endblock %}
{% block body %}
<div class="min-h-[80vh] flex flex-col items-center justify-center">
  <div class="text-center max-w-lg px-4">
    <h1 class="text-4xl font-bold text-gray-900 tracking-tight">
      {{ project_meta.NAME }}
    </h1>
    <p class="mt-4 text-lg text-gray-500">
      Restaurant POS &amp; Management
    </p>
    <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
      <a href="{% url 'account_login' %}"
         class="inline-flex items-center justify-center px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold text-lg hover:bg-blue-700 transition-colors">
        Sign In
      </a>
      <a href="{% url 'account_signup' %}"
         class="inline-flex items-center justify-center px-6 py-3 rounded-lg border border-gray-300 text-gray-700 font-semibold text-lg hover:bg-gray-50 transition-colors">
        Sign Up
      </a>
    </div>
  </div>
</div>
<footer class="mt-10 mb-4">
  <div class="text-center text-gray-700">
    <p>{{ project_meta.NAME }} &mdash; Copyright <span id="copyright-year">2024</span></p>
    <small>
      Built by <a class="text-blue-600 hover:text-blue-800 underline" href="https://www.akorede.dev/" target="_blank">techwithbreezy</a>
    </small>
  </div>
</footer>
{% endblock %}
{% block page_js %}
<script>
  document.getElementById('copyright-year').innerText = (new Date()).getFullYear();
</script>
{% endblock %}
