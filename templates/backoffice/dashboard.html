{% extends "web/app/app_base.html" %}
{% block app %}
<div class="w-full">
  
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Dashboard</h1>
    <p class="mt-2 text-sm font-medium text-gray-500">Overview of your restaurant operations</p>
  </div>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      
      <!-- Card 1: Total Sales -->
      <div class="group bg-white border border-gray-100 shadow-[0_4px_20px_rgb(0,0,0,0.05)] rounded-[1.5rem] p-6 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-[transform,box-shadow] duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-orange-100/50 rounded-full blur-2xl -mr-8 -mt-8 transition-opacity group-hover:opacity-100 opacity-0"></div>
        <div class="flex items-center justify-between mb-4 relative z-10">
          <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Total Sales</h3>
          <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm text-orange-500 ring-1 ring-gray-100">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          </div>
        </div>
        <div class="relative z-10">
          <p class="text-3xl font-extrabold text-gray-900">$4,250.00</p>
          <p class="mt-2 text-xs font-semibold text-emerald-500 flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
            +12.5% from yesterday
          </p>
        </div>
      </div>

      <!-- Card 2: Active Tables -->
      <div class="group bg-white border border-gray-100 shadow-[0_4px_20px_rgb(0,0,0,0.05)] rounded-[1.5rem] p-6 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-[transform,box-shadow] duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-red-100/50 rounded-full blur-2xl -mr-8 -mt-8 transition-opacity group-hover:opacity-100 opacity-0"></div>
        <div class="flex items-center justify-between mb-4 relative z-10">
          <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Active Tables</h3>
          <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm text-red-500 ring-1 ring-gray-100">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
          </div>
        </div>
        <div class="relative z-10">
          <p class="text-3xl font-extrabold text-gray-900">14 <span class="text-xl text-gray-400 font-medium">/ 24</span></p>
          <p class="mt-2 text-xs font-semibold text-gray-500">
            Currently occupied
          </p>
        </div>
      </div>

      <!-- Card 3: Pending Orders -->
      <div class="group bg-white border border-gray-100 shadow-[0_4px_20px_rgb(0,0,0,0.05)] rounded-[1.5rem] p-6 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-[transform,box-shadow] duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-amber-100/50 rounded-full blur-2xl -mr-8 -mt-8 transition-opacity group-hover:opacity-100 opacity-0"></div>
        <div class="flex items-center justify-between mb-4 relative z-10">
          <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Pending Orders</h3>
          <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm text-gray-700 ring-1 ring-gray-100">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
          </div>
        </div>
        <div class="relative z-10">
          <p class="text-3xl font-extrabold text-gray-900">8</p>
          <p class="mt-2 text-xs font-semibold text-amber-500 flex items-center gap-1.5">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
            </span>
            Requires attention
          </p>
        </div>
      </div>

  </div>
</div>
{% endblock %}
