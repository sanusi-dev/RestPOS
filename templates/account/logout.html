{% extends "web/base.html" %}
{% load static %}
{% block body %}
<div class="flex justify-center my-8">
  <div class="w-96 px-4 py-4">
    <h1 class="text-3xl font-bold mb-6 text-center">Sign Out</h1>
    <p class="text-lg mb-6 text-center text-gray-600">Are you sure you want to sign out?</p>
    <form method="post" action="{% url 'account_logout' %}" class="flex flex-col gap-3">
      {% csrf_token %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
      {% endif %}
      <input type="submit" class="inline-flex items-center justify-center px-4 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium transition-colors cursor-pointer" value="Sign Out">
      <a href="{% url 'web:home' %}" class="inline-flex items-center justify-center px-4 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium transition-colors">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
