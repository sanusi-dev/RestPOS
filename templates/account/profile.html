{% extends "web/base.html" %}
{% load form_tags %}
{% block body %}
<div class="flex justify-center my-8">
  <div class="w-full max-w-md px-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Profile</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% render_field form.first_name %}
      {% render_field form.last_name %}
      {% render_field form.email %}
      <div class="mt-4">
        <input class="inline-flex items-center px-4 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700 font-medium transition-colors" type="submit" value="Save">
      </div>
    </form>
  </div>
</div>
{% endblock %}
