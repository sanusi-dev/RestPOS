<div id="cart-panel" hx-include="#catalog-search, #catalog-filter-state" class="flex w-full max-w-full flex-col border-l border-slate-200 bg-slate-100 shadow-[-8px_0_24px_rgb(15,23,42,0.08)] sm:w-[min(100%,22rem)] md:w-[24rem] xl:w-[26rem] 2xl:w-[28rem] shrink-0">

  {% include "pos/partials/cart/guests.html" %}
