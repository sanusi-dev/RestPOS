{% load humanize %}
{% comment %}========== PAYMENT DIALOG (HTMX-loaded) =========={% endcomment %}
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" x-data="{ show: true }" x-show="show"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
     @keydown.escape.window="show = false; window.location.href = '{% url 'pos:pos_order_screen' order.pk %}'">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="show = false; window.location.href = '{% url 'pos:pos_order_screen' order.pk %}'"></div>
  <div class="relative bg-white rounded-[1.5rem] shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
    <div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-extrabold text-gray-900 tracking-tight">Payment</h2>
        <a href="{% url 'pos:pos_order_screen' order.pk %}" class="p-2 rounded-xl text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </a>
      </div>

      <div class="bg-gray-50 rounded-2xl p-4 mb-6 space-y-1.5">
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">Subtotal</span>
          <span class="font-bold text-gray-900">₦{{ order.net_total|intcomma }}</span>
        </div>
        <div class="flex justify-between text-lg font-extrabold text-gray-900 pt-2 border-t border-gray-200">
          <span>Total</span>
          <span>₦{{ order.grand_total|intcomma }}</span>
        </div>
      </div>

      <form method="post" action="{% url 'pos:pos_order_settle' order.pk %}" class="space-y-4">
        {% csrf_token %}
        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Payment Methods</p>
        <div class="space-y-3">
          {% for mode in payment_modes %}
          <div class="flex items-center gap-3">
            <label class="text-sm font-semibold text-gray-700 w-28 shrink-0">{{ mode.name }}</label>
            <input type="number" step="0.01" name="payment_{{ mode.pk }}" placeholder="0.00"
                   class="flex-1 rounded-xl border border-gray-300 px-4 py-2.5 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/25 bg-white/50"
                   onclick="if(!this.value && {{ order.grand_total }}) this.value = {{ order.grand_total }};">
          </div>
          {% endfor %}
        </div>

        <div class="flex gap-3 pt-4 border-t border-gray-100">
          <a href="{% url 'pos:pos_order_screen' order.pk %}" class="flex-1 py-2.5 rounded-xl bg-white border border-gray-200 text-gray-600 text-sm font-semibold text-center hover:bg-gray-50 transition-all">
            Back
          </a>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold shadow hover:bg-emerald-700 transition-all">
            Process Payment
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
