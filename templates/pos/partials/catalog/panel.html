<main class="flex min-w-0 flex-1 flex-col overflow-hidden bg-slate-100 p-3 lg:p-4">
  <div class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-b border-slate-300 pb-3">
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-3">
      {% include "pos/partials/catalog/search.html" %}
      <nav aria-label="Catalog filters" class="flex shrink-0 items-center gap-2">
        <button type="button"
                hx-get="{% url 'pos:pos_order_screen' order.pk %}"
                hx-include="#catalog-search"
                hx-vals='{"group":"","specials":""}'
                hx-target="#catalog-workspace" hx-swap="outerHTML" hx-push-url="true"
                aria-pressed="{% if not catalog_group and not catalog_specials %}true{% else %}false{% endif %}"
                class="{% if not catalog_group and not catalog_specials %}border-teal-600 text-teal-800 ring-1 ring-teal-600/20{% else %}border-slate-300 text-slate-600 hover:border-teal-400 hover:text-teal-800{% endif %}
                       inline-flex min-h-10 items-center gap-2 rounded-xl border bg-transparent px-3 text-sm font-semibold transition-all duration-150 active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-teal-600/30">
          <span class="flex size-4 items-center justify-center">{% hgi_stroke name="grid-view" size="16" color="currentColor" stroke_width="2" %}</span>
          <span>All</span>
        </button>
        <button type="button"
                hx-get="{% url 'pos:pos_order_screen' order.pk %}"
                hx-include="#catalog-search"
                hx-vals='{"group":"","specials":"1"}'
                hx-target="#catalog-workspace" hx-swap="outerHTML" hx-push-url="true"
                aria-pressed="{% if catalog_specials %}true{% else %}false{% endif %}"
                class="{% if catalog_specials %}border-teal-600 text-teal-800 ring-1 ring-teal-600/20{% else %}border-slate-300 text-slate-600 hover:border-teal-400 hover:text-teal-800{% endif %}
                       inline-flex min-h-10 items-center gap-2 rounded-xl border bg-transparent px-3 text-sm font-semibold transition-all duration-150 active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-teal-600/30">
          <span class="flex size-4 items-center justify-center">{% hgi_stroke name="star" size="16" color="currentColor" stroke_width="2" %}</span>
          <span>Special items</span>
        </button>
      </nav>
    </div>
    {% if catalog_has_filters %}
    <button type="button"
            hx-get="{% url 'pos:pos_order_screen' order.pk %}"
            hx-vals='{"clear_filters":"1"}'
            hx-target="#catalog-workspace" hx-swap="outerHTML"
            hx-push-url="{% url 'pos:pos_order_screen' order.pk %}"
            class="inline-flex items-center gap-1.5 text-xs font-semibold text-teal-700 transition-all duration-150 hover:text-teal-900 active:scale-95 active:text-teal-950">
      Clear filters
    </button>
    {% endif %}
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto pt-4 pr-1">
    {% include "pos/partials/catalog/grid.html" %}
  </div>
</main>
