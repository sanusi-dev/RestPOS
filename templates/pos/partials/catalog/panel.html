{% comment %}========== CATALOG (CENTER) =========={% endcomment %}
<main class="min-w-0 flex-1 overflow-y-auto bg-slate-100 p-4 lg:p-6">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">Order menu</p>
      <h1 class="mt-1 text-xl font-bold text-slate-900">Choose items</h1>
    </div>
    <label class="relative block w-full sm:w-72 lg:w-80">
      <span class="sr-only">Search menu items</span>
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
      </svg>
      <input type="search" x-model="search" x-ref="catalogSearch" @keydown.escape="search = ''" placeholder="Search menu items... (Ctrl+K)"
             class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-9 pr-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/20">
    </label>
  </div>

  <div class="mb-4 flex items-center justify-between gap-3">
    <p class="text-sm text-slate-500">
      <span x-text="specialsOnly ? 'Specials' : (activeGroup === 'All' ? 'All items' : activeGroup)"></span>
    </p>
    <button type="button" x-show="search !== '' || specialsOnly" x-cloak
            @click="search = ''; specialsOnly = false; activeGroup = 'All'"
            class="text-xs font-semibold text-teal-700 hover:text-teal-900">
      Clear filters
    </button>
  </div>

  {% include "pos/partials/catalog/grid.html" %}
</main>
