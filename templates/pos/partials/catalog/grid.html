{% load humanize %}
{% comment %}---- Menu item cards ----{% endcomment %}
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
  {% for mi in menu_items %}
  <div x-show="(activeGroup === 'All' || activeGroup === '{{ mi.item.item_group.name|escapejs }}') && (search === '' || '{{ mi.item.item_name|lower|escapejs }}'.includes(search.toLowerCase()))"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       {% if not order_sent %}
       hx-post="{% url 'pos:pos_order_add_item' order.pk %}"
       hx-vals='{"item_id":"{{ mi.item.pk }}","qty":"1"}'
       hx-target="#cart-panel"
       hx-swap="outerHTML"
       {% endif %}
       class="bg-white rounded-xl overflow-hidden shadow-[0_2px_8px_rgb(0,0,0,0.06)] {% if order_sent %}opacity-50 cursor-not-allowed{% else %}cursor-pointer hover:shadow-[0_8px_24px_rgb(0,0,0,0.09)] hover:-translate-y-0.5 active:scale-95{% endif %} transition-all duration-200">
     <div class="aspect-[16/9] bg-[#E5E7EB] flex items-center justify-center">
      <svg class="w-10 h-10 text-[#9CA3AF]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="m21 15-5-5L5 21" />
      </svg>
    </div>
    <div class="px-2.5 py-2 flex items-center justify-between gap-2">
      <p class="text-sm font-medium text-[#111827] truncate">{{ mi.item.item_name }}</p>
      <p class="text-xs text-[#6B7280] shrink-0">₦{{ mi.rate|intcomma }}</p>
    </div>
  </div>
  {% endfor %}
</div>
