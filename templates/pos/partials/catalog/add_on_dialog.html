<div id="add-on-dialog" x-data="{ selected: [] }" @close-add-on-dialog.window="$el.remove()"
     class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="add-on-dialog-title">
  <div class="absolute inset-0 bg-slate-950/45 backdrop-blur-sm" @click="$el.closest('#add-on-dialog').remove()"></div>
  <div class="relative max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-3xl bg-white shadow-2xl ring-1 ring-slate-950/10"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100">
    <div class="flex items-start justify-between border-b border-slate-200 px-6 py-5 sm:px-7 sm:py-6">
      <div class="min-w-0">
        <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-teal-700">Add-ons</p>
        <h2 id="add-on-dialog-title" class="mt-1 break-words text-2xl font-extrabold tracking-tight text-slate-900">{{ menu_item.item_name }}</h2>
        <p class="mt-2 font-mono text-base font-bold tabular-nums text-slate-600">₦{{ menu_item.rate|floatformat:0 }}</p>
      </div>
      <button type="button" @click="$el.closest('#add-on-dialog').remove()"
              class="ml-4 flex size-10 shrink-0 items-center justify-center rounded-xl text-red-500 transition-colors hover:bg-red-50 hover:text-red-700"
              aria-label="Close add-on dialog">
        {% hgi_stroke name="cancel-circle" size="21" color="currentColor" stroke_width="2" %}
      </button>
    </div>

    <form method="post" action="{% url 'pos:pos_order_add_item' order.pk %}" hx-post="{% url 'pos:pos_order_add_item' order.pk %}" hx-include="#catalog-search, #catalog-filter-state" hx-target="#cart-panel" hx-swap="outerHTML" hx-on::before-request="$refs.submitBtn.disabled = true" hx-on::after-request="$refs.submitBtn.disabled = false" class="px-6 py-6 sm:px-7">
      {% csrf_token %}
      {% if add_ons %}
      <fieldset class="border-b border-slate-200 pb-6">
        <div class="mb-4 flex items-end justify-between gap-4">
          <legend class="text-sm font-bold text-slate-900">Choose add-ons</legend>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          {% for add_on in add_ons %}
          <label class="flex min-h-16 cursor-pointer items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm transition-all hover:border-teal-400 hover:bg-teal-50/40"
                 :class="selected.includes('{{ add_on.add_on_item.pk }}') ? 'border-teal-500 bg-teal-50 ring-1 ring-teal-500/20' : ''">
            <span class="flex min-w-0 items-center gap-3">
              <input type="checkbox" name="add_on_ids" value="{{ add_on.add_on_item.pk }}" x-model="selected"
                     class="size-5 shrink-0 rounded-md border-slate-300 text-teal-700 focus:ring-teal-600">
              <span class="break-words text-sm font-semibold leading-5 text-slate-800">{{ add_on.add_on_item.item_name }}</span>
            </span>
            <span class="shrink-0 font-mono text-sm font-bold tabular-nums text-slate-600">₦{{ add_on.menu_item.rate|floatformat:0 }}</span>
          </label>
          {% endfor %}
        </div>
      </fieldset>
      {% endif %}

      <div class="py-6">
        <div class="mb-3 flex items-center justify-between gap-4">
          <label for="add-on-comments" class="text-sm font-bold text-slate-900">Special instructions</label>
        </div>
        <textarea id="add-on-comments" name="comments" maxlength="200" rows="2" placeholder="No onions, extra spicy..."
                  class="w-full resize-none rounded-2xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"></textarea>
      </div>

      <input type="hidden" name="item_id" value="{{ menu_item.item.pk }}">
      <div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-5">
        <button type="button" @click="$el.closest('#add-on-dialog').remove()"
                class="inline-flex min-h-12 items-center gap-2 rounded-2xl border border-red-200 bg-transparent px-5 text-sm font-semibold text-red-600 transition-colors hover:border-red-400 hover:bg-red-50 hover:text-red-700">
          {% hgi_stroke name="cancel-circle" size="17" color="currentColor" stroke_width="2" %}
          Cancel
        </button>
        <button type="submit" x-ref="submitBtn"
                class="inline-flex min-h-12 items-center gap-2 rounded-2xl bg-teal-700 px-7 text-sm font-bold text-white shadow-lg shadow-teal-900/10 transition-colors hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-60">
          {% hgi_stroke name="add-01" size="18" color="currentColor" stroke_width="2" %}
          Add to order
        </button>
      </div>
    </form>
  </div>
</div>
