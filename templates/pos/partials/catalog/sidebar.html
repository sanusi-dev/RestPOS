<aside class="hidden w-44 shrink-0 overflow-y-auto border-r border-slate-200 bg-slate-100 p-2 md:block lg:w-56 lg:p-3">
  <div class="rounded-xl bg-white p-2.5 shadow-sm ring-1 ring-slate-200">
    <h2 class="px-2 pb-3 text-xs font-bold uppercase tracking-wider text-slate-900">Categories</h2>

    <nav aria-label="Menu categories">
      <button type="button"
              hx-get="{% url 'pos:pos_order_screen' order.pk %}"
              hx-include="#catalog-search"
              hx-vals='{"group":"","specials":""}'
              hx-target="#catalog-workspace" hx-swap="outerHTML" hx-push-url="true"
              aria-pressed="{% if not catalog_group and not catalog_specials %}true{% else %}false{% endif %}"
              class="{% if not catalog_group and not catalog_specials %}bg-teal-50 text-teal-800{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}
                     flex min-h-11 w-full items-center gap-2 rounded-lg px-2 text-left text-sm font-semibold transition-all duration-150 active:scale-[0.98] active:bg-teal-50/80 focus:outline-none focus:ring-2 focus:ring-teal-600/30">
        <span class="flex size-5 shrink-0 items-center justify-center">{% hgi_stroke name="grid-view" size="17" color="currentColor" stroke_width="2" %}</span>
        <span class="min-w-0 flex-1 truncate">All items</span>
        <span class="inline-flex min-w-6 shrink-0 items-center justify-center rounded-md bg-slate-900/5 px-1.5 py-0.5 text-xs tabular-nums text-slate-500">{{ catalog_item_count }}</span>
      </button>

      <div class="my-2 border-t border-slate-200"></div>

      <div class="space-y-1">
        {% for group_name, group_items in item_groups.items %}
        <button type="button"
                hx-get="{% url 'pos:pos_order_screen' order.pk %}"
                hx-include="#catalog-search"
                hx-vals='{"group":"{{ group_name|escapejs }}","specials":""}'
                hx-target="#catalog-workspace" hx-swap="outerHTML" hx-push-url="true"
                aria-pressed="{% if catalog_group == group_name and not catalog_specials %}true{% else %}false{% endif %}"
                class="{% if catalog_group == group_name and not catalog_specials %}bg-teal-50 text-teal-800{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}
                       flex min-h-11 w-full items-center gap-2 rounded-lg px-2 text-left text-sm font-medium transition-all duration-150 active:scale-[0.98] active:bg-teal-50/80 focus:outline-none focus:ring-2 focus:ring-teal-600/30">
          <span class="flex size-5 shrink-0 items-center justify-center">{% hgi_stroke name="menu-restaurant" size="17" color="currentColor" stroke_width="2" %}</span>
          <span class="min-w-0 flex-1 truncate">{{ group_name }}</span>
          <span class="inline-flex min-w-6 shrink-0 items-center justify-center rounded-md bg-slate-900/5 px-1.5 py-0.5 text-xs tabular-nums text-slate-500">{{ group_items|length }}</span>
        </button>
        {% endfor %}
      </div>
    </nav>
  </div>
</aside>
