<div class="divide-y divide-gray-100">
  {% for item in order.items.all %}
    <div class="px-4 py-3 hover:bg-gray-50/50 transition">
      <div class="flex items-center justify-between">
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-900 truncate">{{ item.item_name }}</p>
          {% if item.comments %}
            <p class="text-xs text-gray-400 truncate">{{ item.comments }}</p>
          {% endif %}
          {% if order.guest_count > 1 %}
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">C{{ item.customer_index }}</span>
          {% endif %}
        </div>
        <div class="flex items-center gap-2 ml-2">
          <span class="text-sm font-bold text-gray-900">₦{{ item.amount }}</span>
          <span class="text-sm text-gray-500">x{{ item.qty }}</span>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
